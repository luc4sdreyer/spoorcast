[project]
name = "spoorcast"
version = "0.1.0"
description = "Predict the probability that a Dutch passenger train departs late."
readme = "README.md"
license = "MIT"
authors = [{ name = "Lucas Dreyer" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "joblib>=1.4",
    "lightgbm>=4.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
spoorcast = "spoorcast.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spoorcast"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:lightgbm.*",
    # Starlette nudges towards httpx2 for its TestClient; httpx works fine.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
